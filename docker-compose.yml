services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: my-ig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ig_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ig_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ig_auth}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ig_user} -d ${POSTGRES_DB:-ig_auth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── NATS JetStream ─────────────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: my-ig-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]   # -js enables JetStream; -m exposes monitoring
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # HTTP monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Migrate (runs once, then exits) ───────────────────────────────────────
  migrate-auth:
    image: migrate/migrate:v4.18.1
    container_name: my-ig-migrate-auth
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./auth-service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-ig_user}:${POSTGRES_PASSWORD:-ig_pass}@postgres:5432/${POSTGRES_DB:-ig_auth}?sslmode=disable"
      - "up"
    restart: on-failure

  # ── Auth Service ──────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: my-ig-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate-auth:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DB_DSN: "postgres://${POSTGRES_USER:-ig_user}:${POSTGRES_PASSWORD:-ig_pass}@postgres:5432/${POSTGRES_DB:-ig_auth}?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "168h"   # 7 days
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  nats_data:

networks:
  default:
    name: my-ig-network
    